# Конфиг nginx для лендинга Tapir.
# Замени tapir.example.com на свой домен (или на _ если домена нет и заходишь по IP).

server {
    listen 80;
    listen [::]:80;
    server_name tapir.example.com;

    # Раздаём только папку site/, а не весь репозиторий (иначе будут доступны .git и deploy/)
    root /var/www/tapir/site;
    index index.html;

    # Скрытые файлы и папки (.git, .env и т.п.) не отдаём никогда
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Статика кэшируется на час: правки на сайте видны быстро
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 1h;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
